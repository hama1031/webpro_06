<!Doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>京葉線の駅の追加</title>
</head>
<body>
  <h2>駅の追加</h2>
  <form action="/keiyo2_add" method="get">
    ID：<input type="text" name="id"><br>
    駅コード：<input type="text" name="code"><br>
    駅名：<input type="text" name="name"><br>
    乗り換え線：<input type="text" name="change"><br>
    乗降客数：<input type="text" name="passengers"><br>
    東京駅からの距離：<input type="text" name="distance"><br>
    <input type="submit" value="追加">
  </form>
</body>
</html>
