<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>クラブを追加する</title>
</head>
<body>
    <h2>クラブを追加する</h2>
    <form action="/premier_add">
        <label for="id">ID</label>
        <input type="number" name="id" id="id" required><br>

        <label for="name">クラブ名</label>
        <input type="text" name="name" id="name" required><br>

        <label for="city">本拠地</label>
        <input type="text" name="city" id="city" required><br>

        <label for="stadium">スタジアム</label>
        <input type="text" name="stadium" id="stadium" required><br>

        <input type="submit" value="登録">
    </form>
</body>
</html>
